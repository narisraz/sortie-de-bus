name: SortieDeBus
options:
  bundleIdPrefix: com.narisraz
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
targets:
  SortieDeBus:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Sortie de Bus
        PRODUCT_BUNDLE_IDENTIFIER: com.narisraz.sortiedebus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sortie de Bus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
